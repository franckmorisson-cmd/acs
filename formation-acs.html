<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACS — Formation express</title><style> *{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#172b3c;font:18px/1.6 system-ui,sans-serif}main{max-width:850px;margin:30px auto;padding:28px;background:white;border-radius:16px;box-shadow:0 4px 24px #1231}h1{font-size:28px;line-height:1.2}h2{font-size:24px}small{color:#526578}progress{width:100%;accent-color:#176b78}blockquote{margin:16px 0;padding:16px;background:#edf5f6;border-left:4px solid #176b78}button{font:inherit;padding:12px 16px;border:1px solid #aab8c3;border-radius:8px;background:white;color:inherit;cursor:pointer}button:hover{background:#edf5f6}button:focus-visible{outline:3px solid #e6a22b}button:disabled{opacity:.55;cursor:default}.option{display:block;width:100%;text-align:left;margin:8px 0}.selected{border:2px solid #176b78;background:#edf5f6}.primary{background:#176b78;color:white;border-color:#176b78}.primary:hover{background:#105460}nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.feedback{padding:12px;background:#f0f4f7;border-radius:8px}a{color:#176b78}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ccd5dd;text-align:left}@media(max-width:600px){main{margin:0;padding:18px;border-radius:0}body{font-size:16px}}</style><main><small>FORMATION PROFESSIONNELLE · 12 À 15 MINUTES</small><h1>L’approche centrée solution (ACS)</h1><div id="app"></div></main><script>
const pages=[
['Comprendre le principe','Un élève ne fait pas ses devoirs.','Approche centrée problème : « Qu’est-ce qui t’empêche de faire tes devoirs ? »<br>Approche centrée solution : « La dernière fois que tu as réussi à les faire, comment t’y es-tu pris ? Que pourrais-tu reproduire ? »','L’ACS privilégie un avenir souhaitable et la mobilisation des ressources existantes. Les deux approches peuvent être complémentaires.','Quelle est la caractéristique principale de l’ACS ?',['Ignorer les difficultés.','Orienter le questionnement vers les ressources et les solutions.','Féliciter systématiquement.'],1,'Il s’agit de déplacer le questionnement vers les possibilités d’action, sans nier les difficultés.'],
['Définir un avenir souhaitable','Un élève affirme : « Je suis nul en maths. »','Professeur : « Si les choses s’amélioraient, qu’est-ce qui serait différent pendant le cours ? »<br>Élève : « Je pourrais commencer les exercices sans attendre votre aide. »','Transformer une difficulté générale en un objectif positif, précis et observable.','Quelle question correspond à cette intention ?',['Pourquoi es-tu mauvais en maths ?','Peux-tu faire davantage d’efforts ?','À quoi remarquerais-tu que tu progresses ?'],2,'La troisième question fait préciser les signes concrets d’une amélioration.'],
['Repérer les exceptions','Une classe est régulièrement agitée.','Question : « Dans quelles circonstances est-elle plus calme ? »<br>Observation : elle est plus calme pendant les activités courtes avec des consignes écrites.','Repérer les situations où la difficulté est moins présente permet de formuler des hypothèses. Une association ne prouve pas une causalité.','Que peut-on déduire ?',['Les consignes écrites causent nécessairement le calme.','Les activités courtes et les consignes écrites sont des pistes à tester.','La classe n’a aucun problème.'],1,'D’autres facteurs peuvent expliquer le calme. Il faut tester les pistes.'],
['Identifier les ressources','Un élève dit ne pas savoir résoudre de problèmes.','Professeur : « Lors du dernier problème réussi, qu’est-ce qui t’a aidé ? »<br>Élève : « J’avais fait un dessin et utilisé mon cahier. »<br>Professeur : « Comment pourrais-tu réutiliser ces ressources ? »','Faire identifier les connaissances, stratégies, outils et personnes utiles. L’effet recherché est un meilleur sentiment de capacité à agir.','Quelle attitude correspond à cette démarche ?',['Faire identifier les stratégies réellement utiles.','Complimenter indépendamment des résultats.','Supposer que toutes les connaissances sont acquises.'],0,'On mobilise des ressources réelles, sans nier les lacunes.'],
['Déterminer le prochain pas','Un élève estime sa capacité à travailler seul à 3 sur 10.','Professeur : « Pourquoi 3 plutôt que 0 ? »<br>Élève : « Je sais refaire les exemples. »<br>Professeur : « Que faudrait-il pour passer à 4 ? »<br>Élève : « Essayer un exercice similaire sans regarder la correction. »','L’échelle facilite la verbalisation des acquis et la définition d’une action accessible. Elle ne mesure pas objectivement les compétences.','Quel est le rôle de cette échelle ?',['Attribuer une note objective.','Comparer les élèves.','Identifier une prochaine action réalisable.'],2,'C’est un outil de dialogue, non un test standardisé.'],
['Observer les résultats réels','Après un entretien, un élève déclare être plus motivé.','Une semaine plus tard, le professeur relève le nombre d’exercices commencés sans aide et correctement résolus.','Distinguer le ressenti psychologique, le comportement effectif et les apprentissages. Une amélioration du premier ne garantit pas les autres.','Que peut-on conclure du seul ressenti positif ?',['Les résultats scolaires vont progresser.','Le ressenti s’est amélioré ; les autres effets restent à mesurer.','L’ACS est supérieure aux autres méthodes.'],1,'Les trois niveaux de résultats doivent être évalués séparément.'],
['Connaître les limites','Un élève ne comprend pas les fractions parce qu’il ne maîtrise pas les divisions.','Intervention : identifier les lacunes, enseigner les connaissances manquantes et vérifier leur acquisition.','L’ACS est un outil relationnel complémentaire. Elle ne remplace ni le diagnostic, ni l’enseignement, ni les décisions nécessaires en matière de sécurité.','Quelle démarche est pertinente ?',['Enseigner les connaissances manquantes, avec un accompagnement ACS si utile.','Utiliser exclusivement les questions ACS.','Attendre que l’élève découvre seul les connaissances.'],0,'L’expertise professionnelle et l’analyse des causes restent indispensables.'],
['Ce que dit la recherche','Les études distinguent les effets psychosociaux des performances objectives.','Hsu et al. (2021) : 20 études contrôlées, dont 9 randomisées, 1 404 participants ; effet comportemental moyen g = 0,43.<br>Karababa (2024) : 9 études, 309 participants.<br>Vermeulen-Oskam et al. (2024) : 72 études psychosociales.','Les effets sur le ressenti à court terme sont encourageants. Les effets sur les apprentissages, la productivité objective et la supériorité générale sur les alternatives restent insuffisamment établis.','Quelle conclusion est justifiée ?',['L’efficacité pédagogique de l’ACS est démontrée.','L’ACS est totalement inefficace.','Certains effets psychosociaux sont documentés ; les bénéfices pédagogiques restent à établir.'],2,'Les résultats disponibles ne justifient pas une généralisation pédagogique.']];
let i=0,answers=Array(pages.length).fill(null),done=Array(pages.length).fill(false);const app=document.querySelector('#app');function render(){if(i===pages.length){app.innerHTML=`<progress value="8" max="8"></progress><h2>Synthèse</h2><p>Score : ${answers.filter((a,j)=>a===pages[j][6]).length}/8</p><ol><li>Qu’aimerais-tu obtenir ?</li><li>À quoi remarquerais-tu une amélioration ?</li><li>Quand cela fonctionne-t-il déjà ?</li><li>Quelles ressources pourraient t’aider ?</li><li>Quelle action concrète pourrais-tu entreprendre ?</li></ol><p><b>Observer les effets réels et ajuster.</b> L’ACS ne remplace pas le diagnostic pédagogique.</p><h3>Références scientifiques</h3><p><a href="https://doi.org/10.1016/j.childyouth.2020.105620">Hsu et al.</a> · <a href="https://doi.org/10.1177/10497315231170865">Karababa</a> · <a href="https://doi.org/10.1016/j.cpr.2024.102512">Vermeulen-Oskam et al.</a></p><small>Exemples fictifs à visée explicative. Synthèse indépendante, non exhaustive de la formation de Jean-Paul Durand.</small><nav><button onclick="i--;render()">Précédent</button><button onclick="window.print()">Imprimer</button><button onclick="i=0;answers.fill(null);done.fill(false);render()">Recommencer</button></nav>`;return}let p=pages[i];app.innerHTML=`<small>Étape ${i+1} sur 8</small><progress value="${i+1}" max="8"></progress><h2>${p[0]}</h2><p>${p[1]}</p><blockquote>${p[2]}</blockquote><h3>Généralisation</h3><p>${p[3]}</p><hr><h3>${p[4]}</h3>${p[5].map((s,j)=>`<button class="option ${answers[i]===j?'selected':''}" ${done[i]?'disabled':''} onclick="answers[i]=${j};render()">${'ABC'[j]}. ${s}</button>`).join('')}${done[i]?`<div class="feedback" role="status"><b>${answers[i]===p[6]?'Réponse correcte':'Réponse attendue : '+ 'ABC'[p[6]]}</b><br>${p[7]}</div>`:`<button class="primary" ${answers[i]===null?'disabled':''} onclick="done[i]=true;render()">Vérifier</button>`}<nav><button ${i===0?'disabled':''} onclick="i--;render()">Précédent</button><button class="primary" ${!done[i]?'disabled':''} onclick="i++;render()">${i===7?'Voir la synthèse':'Continuer'}</button></nav>`}render();</script></html>
